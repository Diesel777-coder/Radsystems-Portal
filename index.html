<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #1F3C88;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .student-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logout-btn {
            background-color: #E84545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .logout-btn:hover {
            background-color: #d33c3c;
        }
        
        .dashboard-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .section-title {
            color: #1F3C88;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .assignments-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .assignment-card {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #1F3C88;
            transition: all 0.3s ease;
        }
        
        .assignment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .assignment-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        
        .assignment-meta {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            color: #666;
            font-size: 0.9em;
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .status-pending {
            background-color: #ffeeba;
            color: #856404;
        }
        
        .status-submitted {
            background-color: #c3e6cb;
            color: #155724;
        }
        
        .status-checked {
            background-color: #b8daff;
            color: #004085;
        }
        
        .expand-btn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            color: #1F3C88;
            transition: transform 0.3s ease;
        }
        
        .expanded .expand-btn {
            transform: rotate(180deg);
        }
        
        .assignment-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        
        .expanded .assignment-details {
            max-height: 1000px;
        }
        
        .detail-content {
            padding: 15px 0;
            border-top: 1px solid #eee;
            margin-top: 10px;
        }
        
        .upload-section {
            margin: 20px 0;
            padding: 15px;
            background-color: #f0f7ff;
            border-radius: 8px;
        }
        
        .file-input {
            margin: 10px 0;
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .btn-primary {
            background-color: #1F3C88;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #172b63;
        }
        
        .btn-success {
            background-color: #6BCB77;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #5ab866;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .submission-info {
            margin-top: 15px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
        
        .hidden {
            display: none;
        }
        
        .back-btn {
            margin-bottom: 15px;
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            display: none;
        }
        
        .back-btn.visible {
            display: inline-block;
        }
        
        .grade-display {
            margin-top: 15px;
            padding: 10px;
            background-color: #d4edda;
            border-radius: 4px;
            border-left: 4px solid #28a745;
        }
        
        .feedback-display {
            margin-top: 10px;
            padding: 10px;
            background-color: #e2e3e5;
            border-radius: 4px;
            border-left: 4px solid #6c757d;
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .kpi-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .kpi-value {
            font-size: 24px;
            font-weight: bold;
            color: #1F3C88;
            margin: 10px 0;
        }
        
        .kpi-label {
            color: #666;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
            
            .assignment-meta {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="student-info">
                <div>
                    <h1>Student Portal</h1>
                    <p id="student-name">Loading...</p>
                </div>
                <button class="logout-btn" id="logout-btn">Logout</button>
            </div>
        </header>
        
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Active Assignments</div>
                <div class="kpi-value" id="kpi-assignments">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Pending Submissions</div>
                <div class="kpi-value" id="kpi-pending">0</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Graded Assignments</div>
                <div class="kpi-value" id="kpi-graded">0</div>
            </div>
        </div>
        
        <button class="back-btn" id="back-btn">← Back to All Assignments</button>
        
        <div class="dashboard-section">
            <h2 class="section-title">My Assignments</h2>
            <div class="assignments-list" id="assignments-list">
                <!-- Assignments will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentUser = null;
        let studentData = null;
        let assignments = [];
        let expandedAssignmentId = null;
        
        // DOM elements
        const assignmentsList = document.getElementById('assignments-list');
        const studentNameEl = document.getElementById('student-name');
        const logoutBtn = document.getElementById('logout-btn');
        const backBtn = document.getElementById('back-btn');
        const kpiAssignments = document.getElementById('kpi-assignments');
        const kpiPending = document.getElementById('kpi-pending');
        const kpiGraded = document.getElementById('kpi-graded');
        
        // API configuration
        const API_BASE = "https://script.google.com/macros/s/AKfycbxHMxFNXbnPZ_MQskkaPIiqJcqlGN7r1DVtLN_isEY6my4_AW1Wlc9CPhGni_SvrF7f0g/exec";
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Get user data
            apiCall('me', { token })
                .then(response => {
                    if (response.ok) {
                        currentUser = response.user;
                        studentNameEl.textContent = `${currentUser.displayName} - ${currentUser.course}`;
                        loadStudentDashboard(token);
                    } else {
                        alert('Session expired. Please log in again.');
                        localStorage.removeItem('token');
                        window.location.href = 'login.html';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                });
                
            // Set up event listeners
            logoutBtn.addEventListener('click', function() {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            });
            
            backBtn.addEventListener('click', function() {
                collapseAllAssignments();
                backBtn.classList.remove('visible');
                expandedAssignmentId = null;
            });
        });
        
        // Load student dashboard data
        function loadStudentDashboard(token) {
            apiCall('getStudentDashboard', { token })
                .then(response => {
                    if (response.ok) {
                        studentData = response.student;
                        assignments = response.assignments;
                        updateKPIs();
                        renderAssignments();
                    } else {
                        alert('Failed to load dashboard data.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while loading data.');
                });
        }
        
        // Update KPI cards
        function updateKPIs() {
            kpiAssignments.textContent = assignments.length;
            kpiPending.textContent = assignments.filter(a => a.status === 'Pending').length;
            kpiGraded.textContent = assignments.filter(a => a.status === 'Checked').length;
        }
        
        // Render assignments list
        function renderAssignments() {
            assignmentsList.innerHTML = '';
            
            assignments.forEach(assignment => {
                const assignmentEl = createAssignmentElement(assignment);
                assignmentsList.appendChild(assignmentEl);
            });
        }
        
        // Create assignment element
        function createAssignmentElement(assignment) {
            const assignmentEl = document.createElement('div');
            assignmentEl.className = 'assignment-card';
            assignmentEl.dataset.assignmentId = assignment.assignmentId;
            
            const statusClass = getStatusClass(assignment.status);
            
            assignmentEl.innerHTML = `
                <div class="assignment-header">
                    <div>
                        <div class="assignment-title">${assignment.title}</div>
                        <div class="assignment-meta">
                            <span>Unit: ${assignment.unit}</span>
                            <span>Deadline: ${formatDate(assignment.deadline)}</span>
                            <span class="status-badge ${statusClass}">${assignment.status}</span>
                        </div>
                    </div>
                    <button class="expand-btn">▼</button>
                </div>
                <div class="assignment-details">
                    <div class="detail-content">
                        <p><strong>Course:</strong> ${assignment.course}</p>
                        <p><strong>Unit:</strong> ${assignment.unit}</p>
                        <p><strong>Deadline:</strong> ${formatDate(assignment.deadline)}</p>
                        
                        <div class="upload-section" id="upload-section-${assignment.assignmentId}">
                            <h3>Submit Your Work</h3>
                            <input type="file" class="file-input" id="file-input-${assignment.assignmentId}">
                            <button class="btn btn-primary" onclick="handleUpload('${assignment.assignmentId}')" id="upload-btn-${assignment.assignmentId}">Upload File</button>
                            <button class="btn btn-success" onclick="submitAssignment('${assignment.assignmentId}')" id="submit-btn-${assignment.assignmentId}">Submit Assignment</button>
                            
                            <div class="submission-info hidden" id="submission-info-${assignment.assignmentId}">
                                <p><strong>Submitted file:</strong> <span id="submitted-file-${assignment.assignmentId}"></span></p>
                                <button class="btn btn-secondary" onclick="editSubmission('${assignment.assignmentId}')" id="edit-btn-${assignment.assignmentId}">Edit Submission</button>
                            </div>
                        </div>
                        
                        ${assignment.grade ? `
                        <div class="grade-display">
                            <h4>Grade: ${assignment.grade}</h4>
                        </div>
                        ` : ''}
                        
                        ${assignment.feedback ? `
                        <div class="feedback-display">
                            <h4>Feedback:</h4>
                            <p>${assignment.feedback}</p>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            // Set up expand/collapse functionality
            const header = assignmentEl.querySelector('.assignment-header');
            header.addEventListener('click', function() {
                toggleAssignment(assignment.assignmentId);
            });
            
            // Initialize submission state
            initSubmissionState(assignment.assignmentId);
            
            return assignmentEl;
        }
        
        // Toggle assignment expansion
        function toggleAssignment(assignmentId) {
            const assignmentEl = document.querySelector(`[data-assignment-id="${assignmentId}"]`);
            
            if (expandedAssignmentId === assignmentId) {
                // Collapse if already expanded
                assignmentEl.classList.remove('expanded');
                expandedAssignmentId = null;
                backBtn.classList.remove('visible');
            } else {
                // Collapse all others and expand this one
                collapseAllAssignments();
                assignmentEl.classList.add('expanded');
                expandedAssignmentId = assignmentId;
                backBtn.classList.add('visible');
                
                // Scroll to the expanded assignment
                assignmentEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        
        // Collapse all assignments
        function collapseAllAssignments() {
            document.querySelectorAll('.assignment-card').forEach(card => {
                card.classList.remove('expanded');
            });
        }
        
        // Initialize submission state based on assignment status
        function initSubmissionState(assignmentId) {
            const assignment = assignments.find(a => a.assignmentId === assignmentId);
            const uploadBtn = document.getElementById(`upload-btn-${assignmentId}`);
            const submitBtn = document.getElementById(`submit-btn-${assignmentId}`);
            const submissionInfo = document.getElementById(`submission-info-${assignmentId}`);
            const editBtn = document.getElementById(`edit-btn-${assignmentId}`);
            
            if (assignment.status === 'Submitted' || assignment.status === 'Checked') {
                // Already submitted - show edit button instead of upload
                uploadBtn.classList.add('hidden');
                submitBtn.classList.add('hidden');
                submissionInfo.classList.remove('hidden');
                
                // In a real implementation, you would fetch the actual file name
                document.getElementById(`submitted-file-${assignmentId}`).textContent = 
                    'assignment_submission.pdf'; // Placeholder
            } else {
                // Not submitted yet
                uploadBtn.classList.remove('hidden');
                submitBtn.classList.remove('hidden');
                submissionInfo.classList.add('hidden');
            }
        }
        
        // Handle file upload
        function handleUpload(assignmentId) {
            const fileInput = document.getElementById(`file-input-${assignmentId}`);
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file to upload.');
                return;
            }
            
            // In a real implementation, you would upload the file here
            // For now, we'll just show a success message
            alert(`File "${file.name}" ready for submission. Click "Submit Assignment" to complete.`);
        }
        
        // Submit assignment
        function submitAssignment(assignmentId) {
            const fileInput = document.getElementById(`file-input-${assignmentId}`);
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please upload a file before submitting.');
                return;
            }
            
            const token = localStorage.getItem('token');
            
            // Convert file to base64 for submission
            const reader = new FileReader();
            reader.onload = function() {
                const base64 = reader.result.split(',')[1];
                
                apiCall('submitAssignment', {
                    token,
                    assignmentId,
                    file: {
                        filename: file.name,
                        mimeType: file.type,
                        base64: base64
                    }
                })
                .then(response => {
                    if (response.ok) {
                        alert('Assignment submitted successfully!');
                        
                        // Update UI to show submission
                        const uploadBtn = document.getElementById(`upload-btn-${assignmentId}`);
                        const submitBtn = document.getElementById(`submit-btn-${assignmentId}`);
                        const submissionInfo = document.getElementById(`submission-info-${assignmentId}`);
                        
                        uploadBtn.classList.add('hidden');
                        submitBtn.classList.add('hidden');
                        submissionInfo.classList.remove('hidden');
                        
                        // Update assignment status
                        const assignment = assignments.find(a => a.assignmentId === assignmentId);
                        assignment.status = 'Submitted';
                        
                        // Update status badge
                        const badge = document.querySelector(`[data-assignment-id="${assignmentId}"] .status-badge`);
                        badge.textContent = 'Submitted';
                        badge.className = 'status-badge status-submitted';
                        
                        // Update KPIs
                        updateKPIs();
                    } else {
                        alert('Failed to submit assignment: ' + response.error);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while submitting the assignment.');
                });
            };
            reader.readAsDataURL(file);
        }
        
        // Edit submission
        function editSubmission(assignmentId) {
            // Show upload controls again
            const uploadBtn = document.getElementById(`upload-btn-${assignmentId}`);
            const submitBtn = document.getElementById(`submit-btn-${assignmentId}`);
            const submissionInfo = document.getElementById(`submission-info-${assignmentId}`);
            
            uploadBtn.classList.remove('hidden');
            submitBtn.classList.remove('hidden');
            submissionInfo.classList.add('hidden');
        }
        
        // Helper function to get status class
        function getStatusClass(status) {
            switch(status.toLowerCase()) {
                case 'pending': return 'status-pending';
                case 'submitted': return 'status-submitted';
                case 'checked': return 'status-checked';
                default: return 'status-pending';
            }
        }
        
        // Helper function to format date
        function formatDate(dateString) {
            if (!dateString) return 'No deadline';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }
        
        // API call function
        async function apiCall(action, data) {
            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action,
                        ...data
                    })
                });
                
                return await response.json();
            } catch (error) {
                console.error('API call failed:', error);
                throw error;
            }
        }
    </script>
</body>
</html>
