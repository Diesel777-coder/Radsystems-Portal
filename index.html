<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #4a6da7;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .student-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logout-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .logout-btn:hover {
            background-color: #ff5252;
        }
        
        .dashboard-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .section-title {
            color: #4a6da7;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .assignments-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .assignment-card {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #4a6da7;
            transition: all 0.3s ease;
        }
        
        .assignment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .assignment-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        
        .assignment-meta {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            color: #666;
            font-size: 0.9em;
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .status-pending {
            background-color: #ffeeba;
            color: #856404;
        }
        
        .status-submitted {
            background-color: #c3e6cb;
            color: #155724;
        }
        
        .status-checked {
            background-color: #b8daff;
            color: #004085;
        }
        
        .expand-btn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            color: #4a6da7;
            transition: transform 0.3s ease;
        }
        
        .expanded .expand-btn {
            transform: rotate(180deg);
        }
        
        .assignment-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        
        .expanded .assignment-details {
            max-height: 1000px;
        }
        
        .detail-content {
            padding: 15px 0;
            border-top: 1px solid #eee;
            margin-top: 10px;
        }
        
        .upload-section {
            margin: 20px 0;
            padding: 15px;
            background-color: #f0f7ff;
            border-radius: 8px;
        }
        
        .file-input {
            margin: 10px 0;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .btn-primary {
            background-color: #4a6da7;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #3a5a8f;
        }
        
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #218838;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .submission-info {
            margin-top: 15px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
        
        .hidden {
            display: none;
        }
        
        .back-btn {
            margin-bottom: 15px;
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            display: none;
        }
        
        .back-btn.visible {
            display: inline-block;
        }
        
        .grade-display {
            margin-top: 15px;
            padding: 10px;
            background-color: #d4edda;
            border-radius: 4px;
            border-left: 4px solid #28a745;
        }
        
        .feedback-display {
            margin-top: 10px;
            padding: 10px;
            background-color: #e2e3e5;
            border-radius: 4px;
            border-left: 4px solid #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="student-info">
                <div>
                    <h1>Student Portal</h1>
                    <p id="student-name">Loading...</p>
                </div>
                <button class="logout-btn" id="logout-btn">Logout</button>
            </div>
        </header>
        
        <button class="back-btn" id="back-btn">← Back to All Assignments</button>
        
        <div class="dashboard-section">
            <h2 class="section-title">My Assignments</h2>
            <div class="assignments-list" id="assignments-list">
                <!-- Assignments will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Sample data for demonstration
        const assignmentsData = [
            {
                id: 'asg1',
                title: 'Data Structures Project',
                course: 'Computer Science',
                unit: 'CS201',
                deadline: '2023-12-15',
                status: 'Pending',
                description: 'Implement a binary search tree with all operations. Include time complexity analysis for each operation.',
                grade: '',
                feedback: ''
            },
            {
                id: 'asg2',
                title: 'Database Design',
                course: 'Database Systems',
                unit: 'CS305',
                deadline: '2023-12-10',
                status: 'Submitted',
                description: 'Design a normalized database schema for an e-commerce platform. Include ER diagrams and schema definitions.',
                grade: '',
                feedback: ''
            },
            {
                id: 'asg3',
                title: 'Web Development Assignment',
                course: 'Web Technologies',
                unit: 'CS215',
                deadline: '2023-11-28',
                status: 'Checked',
                description: 'Create a responsive dashboard using HTML, CSS, and JavaScript. Implement at least three interactive features.',
                grade: 'A-',
                feedback: 'Excellent work on the responsive design. Consider improving the accessibility features for screen readers.'
            },
            {
                id: 'asg4',
                title: 'Algorithms Problem Set',
                course: 'Advanced Algorithms',
                unit: 'CS420',
                deadline: '2023-12-20',
                status: 'Pending',
                description: 'Solve the provided algorithm problems. Provide time and space complexity analysis for each solution.',
                grade: '',
                feedback: ''
            },
            {
                id: 'asg5',
                title: 'Machine Learning Report',
                course: 'Introduction to ML',
                unit: 'CS350',
                deadline: '2023-11-30',
                status: 'Checked',
                description: 'Compare and contrast three different classification algorithms on the provided dataset.',
                grade: 'B+',
                feedback: 'Good comparison, but needed more depth in the evaluation section. Well-structured report overall.'
            }
        ];

        // Global variables
        let currentUser = null;
        let assignments = [];
        let expandedAssignmentId = null;
        
        // DOM elements
        const assignmentsList = document.getElementById('assignments-list');
        const studentNameEl = document.getElementById('student-name');
        const logoutBtn = document.getElementById('logout-btn');
        const backBtn = document.getElementById('back-btn');
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            // For demo purposes, we'll use sample data
            currentUser = {
                displayName: 'John Smith',
                course: 'Computer Science'
            };
            
            assignments = assignmentsData;
            
            // Render the dashboard
            studentNameEl.textContent = `${currentUser.displayName} - ${currentUser.course}`;
            renderAssignments();
            
            // Set up event listeners
            logoutBtn.addEventListener('click', function() {
                alert('Logout functionality would go here');
            });
            
            backBtn.addEventListener('click', function() {
                collapseAllAssignments();
                backBtn.classList.remove('visible');
                expandedAssignmentId = null;
            });
        });
        
        // Render assignments list
        function renderAssignments() {
            assignmentsList.innerHTML = '';
            
            assignments.forEach(assignment => {
                const assignmentEl = createAssignmentElement(assignment);
                assignmentsList.appendChild(assignmentEl);
            });
        }
        
        // Create assignment element
        function createAssignmentElement(assignment) {
            const assignmentEl = document.createElement('div');
            assignmentEl.className = 'assignment-card';
            assignmentEl.dataset.assignmentId = assignment.id;
            
            const statusClass = getStatusClass(assignment.status);
            
            assignmentEl.innerHTML = `
                <div class="assignment-header">
                    <div>
                        <div class="assignment-title">${assignment.title}</div>
                        <div class="assignment-meta">
                            <span>Unit: ${assignment.unit}</span>
                            <span>Deadline: ${formatDate(assignment.deadline)}</span>
                            <span class="status-badge ${statusClass}">${assignment.status}</span>
                        </div>
                    </div>
                    <button class="expand-btn">▼</button>
                </div>
                <div class="assignment-details">
                    <div class="detail-content">
                        <p><strong>Course:</strong> ${assignment.course}</p>
                        <p><strong>Unit:</strong> ${assignment.unit}</p>
                        <p><strong>Deadline:</strong> ${formatDate(assignment.deadline)}</p>
                        <p><strong>Description:</strong> ${assignment.description}</p>
                        
                        <div class="upload-section" id="upload-section-${assignment.id}">
                            <h3>Submit Your Work</h3>
                            <input type="file" class="file-input" id="file-input-${assignment.id}">
                            <button class="btn btn-primary" onclick="handleUpload('${assignment.id}')" id="upload-btn-${assignment.id}">Upload File</button>
                            <button class="btn btn-success" onclick="submitAssignment('${assignment.id}')" id="submit-btn-${assignment.id}">Submit Assignment</button>
                            
                            <div class="submission-info hidden" id="submission-info-${assignment.id}">
                                <p><strong>Submitted file:</strong> <span id="submitted-file-${assignment.id}"></span></p>
                                <button class="btn btn-secondary" onclick="editSubmission('${assignment.id}')" id="edit-btn-${assignment.id}">Edit Submission</button>
                            </div>
                        </div>
                        
                        ${assignment.grade ? `
                        <div class="grade-display">
                            <h4>Grade: ${assignment.grade}</h4>
                        </div>
                        ` : ''}
                        
                        ${assignment.feedback ? `
                        <div class="feedback-display">
                            <h4>Feedback:</h4>
                            <p>${assignment.feedback}</p>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            // Set up expand/collapse functionality
            const header = assignmentEl.querySelector('.assignment-header');
            header.addEventListener('click', function() {
                toggleAssignment(assignment.id);
            });
            
            // Initialize submission state
            initSubmissionState(assignment.id, assignment.status);
            
            return assignmentEl;
        }
        
        // Toggle assignment expansion
        function toggleAssignment(assignmentId) {
            const assignmentEl = document.querySelector(`[data-assignment-id="${assignmentId}"]`);
            
            if (expandedAssignmentId === assignmentId) {
                // Collapse if already expanded
                assignmentEl.classList.remove('expanded');
                expandedAssignmentId = null;
                backBtn.classList.remove('visible');
            } else {
                // Collapse all others and expand this one
                collapseAllAssignments();
                assignmentEl.classList.add('expanded');
                expandedAssignmentId = assignmentId;
                backBtn.classList.add('visible');
                
                // Scroll to the expanded assignment
                assignmentEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        
        // Collapse all assignments
        function collapseAllAssignments() {
            document.querySelectorAll('.assignment-card').forEach(card => {
                card.classList.remove('expanded');
            });
        }
        
        // Initialize submission state based on assignment status
        function initSubmissionState(assignmentId, status) {
            const uploadBtn = document.getElementById(`upload-btn-${assignmentId}`);
            const submitBtn = document.getElementById(`submit-btn-${assignmentId}`);
            const submissionInfo = document.getElementById(`submission-info-${assignmentId}`);
            const editBtn = document.getElementById(`edit-btn-${assignmentId}`);
            
            if (status === 'Submitted' || status === 'Checked') {
                // Already submitted - show edit button instead of upload
                uploadBtn.classList.add('hidden');
                submitBtn.classList.add('hidden');
                submissionInfo.classList.remove('hidden');
                
                // In a real implementation, you would fetch the actual file name
                document.getElementById(`submitted-file-${assignmentId}`).textContent = 
                    'assignment_submission.pdf'; // Placeholder
            } else {
                // Not submitted yet
                uploadBtn.classList.remove('hidden');
                submitBtn.classList.remove('hidden');
                submissionInfo.classList.add('hidden');
            }
        }
        
        // Handle file upload
        function handleUpload(assignmentId) {
            const fileInput = document.getElementById(`file-input-${assignmentId}`);
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file to upload.');
                return;
            }
            
            // Show a success message
            alert(`File "${file.name}" ready for submission. Click "Submit Assignment" to complete.`);
        }
        
        // Submit assignment
        function submitAssignment(assignmentId) {
            const fileInput = document.getElementById(`file-input-${assignmentId}`);
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please upload a file before submitting.');
                return;
            }
            
            // Find the assignment in our data
            const assignmentIndex = assignments.findIndex(a => a.id === assignmentId);
            if (assignmentIndex === -1) return;
            
            // Update the assignment status
            assignments[assignmentIndex].status = 'Submitted';
            
            // Show success message
            alert('Assignment submitted successfully!');
            
            // Update UI to show submission
            const uploadBtn = document.getElementById(`upload-btn-${assignmentId}`);
            const submitBtn = document.getElementById(`submit-btn-${assignmentId}`);
            const submissionInfo = document.getElementById(`submission-info-${assignmentId}`);
            
            uploadBtn.classList.add('hidden');
            submitBtn.classList.add('hidden');
            submissionInfo.classList.remove('hidden');
            
            // Update status badge
            const badge = document.querySelector(`[data-assignment-id="${assignmentId}"] .status-badge`);
            badge.textContent = 'Submitted';
            badge.className = 'status-badge status-submitted';
            
            // Update the submitted file name
            document.getElementById(`submitted-file-${assignmentId}`).textContent = file.name;
        }
        
        // Edit submission
        function editSubmission(assignmentId) {
            // Show upload controls again
            const uploadBtn = document.getElementById(`upload-btn-${assignmentId}`);
            const submitBtn = document.getElementById(`submit-btn-${assignmentId}`);
            const submissionInfo = document.getElementById(`submission-info-${assignmentId}`);
            
            uploadBtn.classList.remove('hidden');
            submitBtn.classList.remove('hidden');
            submissionInfo.classList.add('hidden');
            
            // Find the assignment in our data
            const assignmentIndex = assignments.findIndex(a => a.id === assignmentId);
            if (assignmentIndex === -1) return;
            
            // Update the assignment status
            assignments[assignmentIndex].status = 'Pending';
            
            // Update status badge
            const badge = document.querySelector(`[data-assignment-id="${assignmentId}"] .status-badge`);
            badge.textContent = 'Pending';
            badge.className = 'status-badge status-pending';
        }
        
        // Helper function to get status class
        function getStatusClass(status) {
            switch(status.toLowerCase()) {
                case 'pending': return 'status-pending';
                case 'submitted': return 'status-submitted';
                case 'checked': return 'status-checked';
                default: return 'status-pending';
            }
        }
        
        // Helper function to format date
        function formatDate(dateString) {
            if (!dateString) return 'No deadline';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }
    </script>
</body>
</html>
